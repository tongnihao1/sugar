<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糖霜小站 · 一把撒开的照片</title>
<meta name="description" content="十八张照片随机散在桌面上，每次打开位置都不一样；点一张会被抽到眼前。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FCE3EA'/%3E%3Cpath d='M16 24.5s-8.4-5.4-8.4-11.4A4.7 4.7 0 0116 10a4.7 4.7 0 018.4 3.1c0 6-8.4 11.4-8.4 11.4z' fill='%23DF6189'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body>

<div class="pool" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>

<header class="bar">
  <a class="back" href="index.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    回糖霜小站
  </a>
  <div class="title">
    <h1>一把撒开的照片</h1>
    <p class="sub">十八张里，一次撒九张</p>
  </div>
  <button class="reshuffle" id="reshuffle" type="button">再撒一次</button>
</header>

<main class="stage" id="stage" aria-label="随机散落的照片">
  <div class="deck" id="deck">

    <button class="print" type="button" data-title="夜里那场雨" data-note="收工以后，招牌还亮着">
      <img src="image/street-rain.jpg" alt="雨夜的窄街，招牌的光倒在水洼里" loading="eager" decoding="async">
      <span class="cap"><i>01</i>夜里那场雨</span>
    </button>

    <button class="print" type="button" data-title="下午四点的光" data-note="风把纱帘吹起来的那一下">
      <img src="image/curtain-light.jpg" alt="粉色纱帘被斜射的阳光穿过" loading="eager" decoding="async">
      <span class="cap"><i>02</i>下午四点的光</span>
    </button>

    <button class="print" type="button" data-title="一杯冰的" data-note="糖融在水里，光留在杯壁上">
      <img src="image/glass-drink.jpg" alt="玻璃杯上的水珠映出彩色光斑" loading="eager" decoding="async">
      <span class="cap"><i>03</i>一杯冰的</span>
    </button>

    <button class="print" type="button" data-title="抬头" data-note="云翻过去的时候，天是粉的">
      <img src="image/sky-cloud.jpg" alt="粉色的云海与远处的城市剪影" loading="eager" decoding="async">
      <span class="cap"><i>04</i>抬头</span>
    </button>

    <button class="print" type="button" data-title="暗房的红灯" data-note="照片还没显影，就已经很好看">
      <img src="image/darkroom.jpg" alt="暗房里红灯下的相纸与夹子" loading="eager" decoding="async">
      <span class="cap"><i>05</i>暗房的红灯</span>
    </button>

    <button class="print" type="button" data-title="火星" data-note="点着的那根，烧得比想的快">
      <img src="image/sparkler.jpg" alt="仙女棒喷出的火星与烟雾" loading="eager" decoding="async">
      <span class="cap"><i>06</i>火星</span>
    </button>

    <button class="print" type="button" data-title="摩天轮" data-note="灯一圈圈亮起来，人还没上">
      <img src="image/ferris-wheel.jpg" alt="夜色里亮着糖果色灯珠的摩天轮" loading="eager" decoding="async">
      <span class="cap"><i>07</i>摩天轮</span>
    </button>

    <button class="print" type="button" data-title="糖纸" data-note="揉皱的糖纸也要留着">
      <img src="image/sugar-paper.jpg" alt="深色台面上散落的糖纸与碎糖" loading="eager" decoding="async">
      <span class="cap"><i>08</i>糖纸</span>
    </button>

    <button class="print" type="button" data-title="碰碰车" data-note="抓着栏杆的那只手，比车还紧张">
      <img src="image/090b9cd56f1a78057fb4cde18c3594f.jpg" alt="室内碰碰车场上散开的彩色碰碰车" loading="eager" decoding="async">
      <span class="cap"><i>09</i>碰碰车</span>
    </button>

    <button class="print" type="button" data-title="绿色的钢架" data-note="灯一格一格往上爬">
      <img src="image/193e0ca842823257bf944fbf2538977.jpg" alt="隔着玻璃看出去的绿色桁架与灯带" loading="eager" decoding="async">
      <span class="cap"><i>10</i>绿色的钢架</span>
    </button>

    <button class="print" type="button" data-title="过山车的红" data-note="护肩还没扣好，就开始怕了">
      <img src="image/22b10f4d856880b8e52c8faf5935b10.jpg" alt="红色过山车车厢里坐着的几个人" loading="eager" decoding="async">
      <span class="cap"><i>11</i>过山车的红</span>
    </button>

    <button class="print" type="button" data-title="秋千上" data-note="逆光把铁链照成一根金线">
      <img src="image/5376122e5cfd742d8331b478575e297.jpg" alt="逆光下荡着的秋千与靠在上面的男孩" loading="eager" decoding="async">
      <span class="cap"><i>12</i>秋千上</span>
    </button>

    <button class="print" type="button" data-title="树影里的轮" data-note="蓝灯一圈，慢慢转">
      <img src="image/5c48a8498b35e67d835ebcf2bef0b48.jpg" alt="夜色里的摩天轮与棕榈树叶影" loading="eager" decoding="async">
      <span class="cap"><i>13</i>树影里的轮</span>
    </button>

    <button class="print" type="button" data-title="门口那道拱" data-note="铁栅栏拉着，天还亮着">
      <img src="image/7739361bf4e3ff2bf86fb84e7ad8e37.jpg" alt="乐园入口的蓝色城堡式墙面与拱门" loading="eager" decoding="async">
      <span class="cap"><i>14</i>门口那道拱</span>
    </button>

    <button class="print" type="button" data-title="往下看" data-note="玻璃上全是自己的影子">
      <img src="image/a0ac1a6f5b9f7b3d9bb4bc1496d40cd.jpg" alt="从缆车玻璃窗俯瞰夜色里的游乐设施" loading="eager" decoding="async">
      <span class="cap"><i>15</i>往下看</span>
    </button>

    <button class="print" type="button" data-title="城堡亮了" data-note="灯一盏盏开，人从广场走过">
      <img src="image/a5d2664b5a4b83f45b202ef95bf2d2d.jpg" alt="夜里被彩灯照亮的城堡式建筑与广场" loading="eager" decoding="async">
      <span class="cap"><i>16</i>城堡亮了</span>
    </button>

    <button class="print" type="button" data-title="喷水的鲸" data-note="水柱细得像一根线">
      <img src="image/a9800fc191d7a1f855bbe931836b516.jpg" alt="蓝色鲸鱼造型的游乐装置正在喷水" loading="eager" decoding="async">
      <span class="cap"><i>17</i>喷水的鲸</span>
    </button>

    <button class="print" type="button" data-title="一盆烤鱼" data-note="纸包着，热气全闷在里面">
      <img src="image/e31a35f79fd7c437d7ad353e4a373b0.jpg" alt="桌上的纸包烤鱼与围在旁边的几个人" loading="eager" decoding="async">
      <span class="cap"><i>18</i>一盆烤鱼</span>
    </button>

  </div>
</main>

<footer class="hint">
  <span class="counter" id="counter">01 / 09</span>
  <span class="star-title" id="starTitle" hidden></span>
  <span class="tip" id="tip">拖一下鼠标，整桌会跟着歪；点一张，它会被抽到眼前</span>
  <span class="keys">← → 换一张 · Esc 收起 · R 再撒一次</span>
</footer>

<script src="js/gallery.js"></script>
</body>
</html>
