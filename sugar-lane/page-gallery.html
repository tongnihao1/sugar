<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糖霜小站 · 一把撒开的照片</title>
<meta name="description" content="八张照片随机散在桌面上，每次打开位置都不一样；点一张会被抽到眼前。照片都是示例素材。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FCE3EA'/%3E%3Cpath d='M16 24.5s-8.4-5.4-8.4-11.4A4.7 4.7 0 0116 10a4.7 4.7 0 018.4 3.1c0 6-8.4 11.4-8.4 11.4z' fill='%23DF6189'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="css/gallery.css">
</head>
<body>

<div class="pool" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>

<header class="bar">
  <a class="back" href="sugar-lane.html">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    回糖霜小站
  </a>
  <div class="title">
    <h1>一把撒开的照片</h1>
    <p class="sub">八张，每次打开都散在不同的位置</p>
  </div>
  <button class="reshuffle" id="reshuffle" type="button">再撒一次</button>
</header>

<main class="stage" id="stage" aria-label="随机散落的照片">
  <div class="deck" id="deck">

    <button class="print" type="button" data-title="夜里那场雨" data-note="收工以后，招牌还亮着">
      <img src="image/street-rain.jpg" alt="雨夜的窄街，招牌的光倒在水洼里" loading="eager" decoding="async">
      <span class="cap"><i>01</i>夜里那场雨</span>
    </button>

    <button class="print" type="button" data-title="下午四点的光" data-note="风把纱帘吹起来的那一下">
      <img src="image/curtain-light.jpg" alt="粉色纱帘被斜射的阳光穿过" loading="eager" decoding="async">
      <span class="cap"><i>02</i>下午四点的光</span>
    </button>

    <button class="print" type="button" data-title="一杯冰的" data-note="糖融在水里，光留在杯壁上">
      <img src="image/glass-drink.jpg" alt="玻璃杯上的水珠映出彩色光斑" loading="eager" decoding="async">
      <span class="cap"><i>03</i>一杯冰的</span>
    </button>

    <button class="print" type="button" data-title="抬头" data-note="云翻过去的时候，天是粉的">
      <img src="image/sky-cloud.jpg" alt="粉色的云海与远处的城市剪影" loading="eager" decoding="async">
      <span class="cap"><i>04</i>抬头</span>
    </button>

    <button class="print" type="button" data-title="暗房的红灯" data-note="照片还没显影，就已经很好看">
      <img src="image/darkroom.jpg" alt="暗房里红灯下的相纸与夹子" loading="eager" decoding="async">
      <span class="cap"><i>05</i>暗房的红灯</span>
    </button>

    <button class="print" type="button" data-title="火星" data-note="点着的那根，烧得比想的快">
      <img src="image/sparkler.jpg" alt="仙女棒喷出的火星与烟雾" loading="eager" decoding="async">
      <span class="cap"><i>06</i>火星</span>
    </button>

    <button class="print" type="button" data-title="摩天轮" data-note="灯一圈圈亮起来，人还没上">
      <img src="image/ferris-wheel.jpg" alt="夜色里亮着糖果色灯珠的摩天轮" loading="eager" decoding="async">
      <span class="cap"><i>07</i>摩天轮</span>
    </button>

    <button class="print" type="button" data-title="糖纸" data-note="揉皱的糖纸也要留着">
      <img src="image/sugar-paper.jpg" alt="深色台面上散落的糖纸与碎糖" loading="eager" decoding="async">
      <span class="cap"><i>08</i>糖纸</span>
    </button>

  </div>
</main>

<footer class="hint">
  <span class="counter" id="counter">01 / 08</span>
  <span class="star-title" id="starTitle" hidden></span>
  <span class="tip" id="tip">拖一下鼠标，整桌会跟着歪；点一张，它会被抽到眼前</span>
  <span class="keys">← → 换一张 · Esc 收起 · R 再撒一次</span>
</footer>

<script src="js/gallery.js"></script>
</body>
</html>
