<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>糖霜小站 · 凭这张纸进来</title>
<meta name="description" content="糖霜小站的入门页：填对账号、口令和验证码，才看得到里面的照片和心事。">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23FCE3EA'/%3E%3Cg stroke='%23DF6189' fill='none' stroke-width='2.4'%3E%3Ccircle cx='12.5' cy='12.5' r='4.6'/%3E%3Cpath d='M16 16 23.6 23.6'/%3E%3Cpath d='M21.2 21.2 24.4 18' stroke-width='2.2'/%3E%3Cpath d='M20.6 26 23.8 22.8' stroke-width='2.2'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn" crossorigin>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+XiaoWei&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="backdrop" aria-hidden="true"></div>
<div class="pool" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<main class="desk">
  <section class="ticket" id="ticket" aria-labelledby="t-title">
    <span class="tape" aria-hidden="true"></span>
    <span class="stamp" aria-hidden="true">通过</span>

    <p class="kicker">sugar lane</p>
    <h1 id="t-title">凭这张纸进来</h1>
    <p class="lede">这一页只留给知道口令的人。填完账号、密码，再照着图上的四个字抄一遍。</p>

    <form id="form" novalidate autocomplete="off">
      <div class="field">
        <label class="cap" for="user">账号</label>
        <input id="user" name="user" type="text" autocomplete="username" spellcheck="false" autocapitalize="off" aria-label="账号">
      </div>

      <div class="field field-pass">
        <label class="cap" for="pass">密码</label>
        <input id="pass" name="pass" type="password" autocomplete="current-password" aria-label="密码">
        <button class="peek" id="peek" type="button" aria-label="显示密码">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
            <circle cx="12" cy="12" r="3.1"/>
            <path class="slash" d="M4.4 19.6 19.6 4.4"/>
          </svg>
        </button>
      </div>

      <div class="field">
        <label class="cap" for="code">验证码</label>
        <div class="code-row">
          <input id="code" name="code" type="text" inputmode="latin" maxlength="4" autocomplete="off" spellcheck="false" autocapitalize="characters" aria-label="验证码">
          <canvas id="captcha" width="120" height="46" tabindex="0" role="button" aria-label="点击换一张验证码"></canvas>
        </div>
      </div>

      <p class="msg" id="msg" role="status" aria-live="polite">照图抄那四个字，换图点一下右边的纸片。</p>

      <button class="go" id="go" type="submit">盖章进入</button>
    </form>

    <p class="foot">钥匙只留在这次会话里 · <b>关掉浏览器</b>之后要重新盖一次章</p>
  </section>
</main>

<div class="grain" aria-hidden="true"></div>

<script src="js/auth.js?v=20251116a"></script>
<script src="js/login.js?v=20251116a"></script>
</body>
</html>
